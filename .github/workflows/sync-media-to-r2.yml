# Copies Pages CMS uploads to the Cloudflare R2 bucket the newspaper serves media from.
# Off until R2 access exists: set these in this repository's settings.
#   Secrets:   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   Variables: R2_ACCOUNT_ID, R2_BUCKET
name: Sync media to R2

on:
  push:
    branches: [main]
    paths: ["content/media/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.R2_BUCKET != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Objects are stored under `media/`, so HERALD_MEDIA_BASE_URL is just the bucket's
      # public origin. No --delete: removing a file from git keeps it in R2 for old links.
      - name: Upload new and changed files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: >
          aws s3 sync content/media "s3://${{ vars.R2_BUCKET }}/media"
          --endpoint-url "https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          --exclude ".gitkeep"
